[package]
name = "midtest"
version = "0.1.0"
description = "MidTest desktop application"
authors = ["MidTest"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "midtest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
agent-client-protocol = "2"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
keyring = { version = "3.6.3", features = ["apple-native"] }
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "system-proxy"] }

[dev-dependencies]
# Transport `Lines` milik agent-client-protocol berbicara dalam Sink/Stream
# `futures`, jadi agen palsu di test butuh channel-nya. Hanya untuk test.
futures = "0.3"
# `kill(pid, 0)`: satu-satunya cara memeriksa dari Rust apakah proses OS milik
# adapter *sungguhan* masih hidup, dipakai test Task 7 untuk membuktikan
# penutupan sesi lama benar-benar mematikan prosesnya — bukan sekadar
# mempercayai kode terlihat benar. Sudah ada di Cargo.lock lewat
# agent-client-protocol (async-process), jadi ini tidak menambah unduhan.
libc = "0.2"
